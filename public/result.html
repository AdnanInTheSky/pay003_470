<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Result</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-md text-center">

  <!-- STATUS ICON -->
  <div id="icon" class="text-6xl mb-4"></div>

  <!-- TITLE -->
  <h1 id="title" class="text-2xl font-bold mb-2"></h1>

  <!-- MESSAGE -->
  <p id="message" class="text-gray-600 mb-4"></p>

  <!-- INVOICE -->
  <div class="bg-gray-100 p-3 rounded text-sm mb-4">
    Invoice: <span id="invoice" class="font-mono"></span>
  </div>

  <!-- STATUS -->
  <div class="text-sm mb-6">
    Status: <span id="status" class="font-semibold"></span>
  </div>

  <!-- BUTTONS -->
  <div class="space-y-2">
    <a href="/" class="block bg-black text-white py-2 rounded">
      Back to Store
    </a>

    <button onclick="checkStatus()" class="block w-full border py-2 rounded">
      Refresh Status
    </button>
  </div>

</div>

<script>
// ---------------- GET QUERY PARAMS ----------------
const params = new URLSearchParams(window.location.search);

const invoice = params.get("invoice") || params.get("invoice_number") || "";
const statusParam = params.get("status") || "";

// ---------------- UI ELEMENTS ----------------
const icon = document.getElementById("icon");
const title = document.getElementById("title");
const message = document.getElementById("message");
const statusEl = document.getElementById("status");
const invoiceEl = document.getElementById("invoice");

// ---------------- INIT UI ----------------
invoiceEl.innerText = invoice;
statusEl.innerText = statusParam || "Processing";

// ---------------- STATUS LOGIC ----------------
if (statusParam.toLowerCase().includes("success")) {
  icon.innerText = "✅";
  title.innerText = "Payment Successful";
  message.innerText = "Your order has been confirmed.";
  statusEl.className = "text-green-600 font-semibold";
}
else if (statusParam.toLowerCase().includes("fail")) {
  icon.innerText = "❌";
  title.innerText = "Payment Failed";
  message.innerText = "Transaction was not completed.";
  statusEl.className = "text-red-600 font-semibold";
}
else {
  icon.innerText = "⏳";
  title.innerText = "Processing Payment";
  message.innerText = "Please wait while we verify your transaction.";
  statusEl.className = "text-yellow-600 font-semibold";
}

// ---------------- OPTIONAL LIVE CHECK ----------------
async function checkStatus() {
  if (!invoice) return;

  try {
    const res = await fetch(`/api/order-status/${invoice}`);
    const data = await res.json();

    statusEl.innerText = data.status;

    if (data.status === "success") {
      icon.innerText = "✅";
      title.innerText = "Payment Successful";
      message.innerText = "Verified from server.";
      statusEl.className = "text-green-600 font-semibold";
    }

    if (data.status === "failed") {
      icon.innerText = "❌";
      title.innerText = "Payment Failed";
      message.innerText = "Server marked transaction as failed.";
      statusEl.className = "text-red-600 font-semibold";
    }

  } catch (err) {
    alert("Failed to fetch status");
  }
}
</script>

</body>
</html>
