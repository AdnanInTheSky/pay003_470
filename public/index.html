<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Express PayStation Store</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- HEADER -->
<div class="bg-black text-white p-4 flex justify-between items-center">
  <h1 class="font-bold text-xl">PayStation Store</h1>

  <button onclick="toggleCart()" class="bg-white text-black px-4 py-1 rounded">
    Cart (<span id="cartCount">0</span>)
  </button>
</div>

<!-- PRODUCTS -->
<div class="grid md:grid-cols-3 gap-4 p-6" id="products"></div>

<!-- CART DRAWER -->
<div id="cart" class="fixed right-0 top-0 w-96 h-full bg-white shadow-xl p-4 transform translate-x-full transition-transform">

  <h2 class="text-xl font-bold mb-4">Cart</h2>

  <div id="cartItems" class="space-y-3"></div>

  <div class="mt-4 border-t pt-4">
    <p class="font-bold">Total: ৳<span id="total">0</span></p>

    <input id="name" class="w-full border p-2 mt-2" placeholder="Name">
    <input id="email" class="w-full border p-2 mt-2" placeholder="Email">
    <input id="phone" class="w-full border p-2 mt-2" placeholder="Phone">
    <input id="address" class="w-full border p-2 mt-2" placeholder="Address">

    <button onclick="checkout()" class="bg-green-600 text-white w-full p-2 mt-3">
      Pay Now
    </button>
  </div>
</div>

<!-- OVERLAY -->
<div id="overlay" onclick="toggleCart()" class="hidden fixed inset-0 bg-black/40"></div>

<script>
// ---------------- PRODUCTS (must match backend IDs) ----------------
const PRODUCTS = {
  p1: { name: "Wireless Earbuds", price: 5, emoji: "🎧" },
  p2: { name: "Phone Case", price: 3, emoji: "📱" },
  p3: { name: "USB-C Cable", price: 18, emoji: "🔌" },
  p4: { name: "Power Bank", price: 9, emoji: "🔋" },
  p5: { name: "Screen Protector", price: 12, emoji: "🛡️" },
  p6: { name: "Watch Strap", price: 28, emoji: "⌚" }
};

// ---------------- CART STATE ----------------
let cart = {};

// ---------------- RENDER PRODUCTS ----------------
function renderProducts() {
  const box = document.getElementById("products");
  box.innerHTML = "";

  for (let id in PRODUCTS) {
    const p = PRODUCTS[id];

    box.innerHTML += `
      <div class="bg-white p-4 shadow rounded">
        <div class="text-3xl">${p.emoji}</div>
        <h2 class="font-bold">${p.name}</h2>
        <p>৳${p.price}</p>

        <button onclick="add('${id}')"
          class="bg-black text-white px-3 py-1 mt-2 rounded">
          Add
        </button>
      </div>
    `;
  }
}

// ---------------- CART LOGIC ----------------
function add(id) {
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
}

function remove(id) {
  cart[id]--;
  if (cart[id] <= 0) delete cart[id];
  renderCart();
}

function countCart() {
  return Object.values(cart).reduce((a,b)=>a+b,0);
}

// ---------------- RENDER CART ----------------
function renderCart() {
  document.getElementById("cartCount").innerText = countCart();

  const box = document.getElementById("cartItems");
  box.innerHTML = "";

  let total = 0;

  for (let id in cart) {
    const qty = cart[id];
    const p = PRODUCTS[id];

    total += p.price * qty;

    box.innerHTML += `
      <div class="flex justify-between border-b pb-2">
        <div>
          <p>${p.emoji} ${p.name}</p>
          <p>৳${p.price} x ${qty}</p>
        </div>

        <div>
          <button onclick="remove('${id}')">-</button>
          <span class="px-2">${qty}</span>
          <button onclick="add('${id}')">+</button>
        </div>
      </div>
    `;
  }

  document.getElementById("total").innerText = total;
}

// ---------------- CART TOGGLE ----------------
function toggleCart() {
  const c = document.getElementById("cart");
  const o = document.getElementById("overlay");

  const open = c.classList.contains("translate-x-full");

  if (open) {
    c.classList.remove("translate-x-full");
    o.classList.remove("hidden");
  } else {
    c.classList.add("translate-x-full");
    o.classList.add("hidden");
  }
}

// ---------------- CHECKOUT ----------------
async function checkout() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const phone = document.getElementById("phone").value;
  const address = document.getElementById("address").value;

  if (!name || !email || !phone || !address) {
    alert("Fill all fields");
    return;
  }

  const items = Object.entries(cart).map(([id, qty]) => ({
    id,
    qty
  }));

  if (items.length === 0) {
    alert("Cart empty");
    return;
  }

  const res = await fetch("/api/create-order", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, phone, address, items })
  });

  const data = await res.json();

  if (data.payment_url) {
    window.location.href = data.payment_url;
  } else {
    alert(data.error || "Payment failed");
  }
}

// init
renderProducts();
renderCart();
</script>

</body>
</html>
